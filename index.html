<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <title>Weighbridge Data Cleaner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="./assets/icons/weighbridge-cleaner-icon.png">
  <link rel="shortcut icon" type="image/png" href="./assets/icons/weighbridge-cleaner-icon.png">
  <link rel="apple-touch-icon" href="./assets/icons/weighbridge-cleaner-icon.png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header id="app-header">
    <div id="app-header-inner">
      <div id="app-header-title">
        <img id="app-logo" src="./assets/icons/weighbridge-cleaner-icon.png" alt="Weighbridge Data Cleaner" width="32" height="32">
        <h1>Weighbridge Data Cleaner</h1>
      </div>
      <div id="app-header-controls">
        <div id="decimal-format-page" aria-label="Excel Decimal Format"></div>
        <button id="reset-btn" type="button">Clear / Reset</button>
      </div>
    </div>
  </header>

  <main id="app">
    <section id="list-dt-page" class="result-section" aria-label="List DT"></section>
    <section id="import-page" aria-label="Import"></section>
    <section id="result-page" aria-label="Cleaning Results"></section>
  </main>

  <div id="bottom-action-bar-container"></div>

  <script src="./lib/sheetjs/xlsx.full.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
